[project]
name = "netschoolapi-plus"
version = "11.1.0"
description = "Форк netschoolapi: асинхронный API-клиент для «Сетевого города» с расширенными возможностями"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.23.3",
    "marshmallow==3.19.0",
    "marshmallow-dataclass==8.5.11",
    "websockets>=17.1",
    "beautifulsoup4>=4.15",
]

[tool.setuptools]
packages = ["netschoolapi_plus"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
